<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Engine</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); max-width: 400px; width: 100%; }
        #mainContainer.step2-active { max-width: 1200px; }
        h1 { color: #1d1d1f; font-size: 1.5rem; margin: 0 0 0.25rem 0; }
        h3 { margin: 0; }
        p.subtitle { color: #86868b; font-size: 0.95rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #1d1d1f; margin-bottom: 0.5rem; }
        input, select { width: 100%; padding: 12px; font-size: 0.95rem; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1); }
        
        .action-btn { width: 100%; background-color: #1d1d1f; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-weight: 600; transition: background 0.2s; }
        .action-btn:hover { background-color: #424245; }
        #popBtn { width: 100%; padding: 12px; background: #0071e3; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 2rem; font-weight: 600; transition: background 0.2s; }
        #popBtn:hover { background-color: #0066d6; }
        
        .step-panel { display: none; }
        .step-panel.active { display: block; }
        
        /* Step 2 button sizing */
        #step2 .action-btn { width: auto; padding: 12px 32px; display: block; margin: 2rem auto 0; }
        
        /* Play button layout */
        .intentions-layout { display: flex; gap: 1.5rem; align-items: flex-start; margin-top: 2rem; height: 100%; }
        
        .left-column { flex: 0 0 45%; display: flex; flex-direction: column; gap: 2rem; overflow: hidden; }
        
        .search-container { flex: 1; min-width: 0; }
        .search-input-wrapper { margin-bottom: 1rem; }
        .search-input-wrapper input { width: 100%; }
        .search-results { min-height: 60px; max-height: 200px; overflow-y: auto; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; background: #fafafa; }
        .search-results.empty { color: #86868b; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
        
        .top-4-container { flex: 1; min-width: 0; }
        .top-4-label { font-size: 0.85rem; font-weight: 600; color: #86868b; margin-bottom: 0.75rem; }
        .top-4-items { min-height: 60px; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; background: #fafafa; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; overflow: hidden; }
        
        .selections-container { flex: 0 0 45%; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .selections-label { font-size: 0.85rem; font-weight: 600; color: #86868b; margin-bottom: 0.75rem; }
        .selections { min-height: 150px; max-height: 400px; padding: 12px; border: 2px solid #d2d2d7; border-radius: 8px; background: #f9fafb; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; overflow-y: auto; }
        .selections.empty { color: #86868b; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
        
        .pill { padding: 10px 12px; border-radius: 20px; border: 1px solid #d2d2d7; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; user-select: none; background: white; color: #1d1d1f; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; flex-shrink: 1; }
        .pill:hover { border-color: #0071e3; background-color: #f0f6ff; }
        .pill.top-4 { background: #f0f0f0; border-color: #d2d2d7; }
        .pill.top-4:hover { background: #e8e8ed; }
        .pill.selected { background-color: #0071e3; border-color: #0071e3; color: white; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .pill.selected:hover { background-color: #0066d6; }
        
        .pill-remove { cursor: pointer; font-weight: bold; opacity: 0.7; flex-shrink: 0; }
        .pill-remove:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="step1" class="step-panel active">
            <h1>Software Discovery Engine</h1>
            <p class="subtitle">Fill out form to get recommendations!</p>
            <button id="popBtn" onclick="runAutoPopulate()">Randomize Form</button>
            <form onsubmit="submitLeadForm(event)">
                <div class="form-group"><label>First Name</label><input type="text" id="firstName" required></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Company</label><input type="text" id="companyName" required></div>
                <div class="form-group"><label>Size</label><select id="companySize" required><option value="">-- Select Size --</option><option value="Small">Small</option><option value="Medium">Medium</option><option value="Enterprise">Enterprise</option></select></div>
                <div class="form-group"><label>Industry</label><select id="industrySelect" required><option value="">-- Select Industry --</option></select></div>
                <div class="form-group"><label>Department</label><select id="pillarSelect" required><option value="">-- Select Department --</option></select></div>
                <button type="submit" class="action-btn" id="submitBtn">Submit & Continue</button>
            </form>
        </div>

        <div id="step2" class="step-panel">
            <h1>Company Initiatives or Pain Points</h1>
            <p class="subtitle">Select initiatives that matter to you:</p>
            
            <div class="intentions-layout">
                <!-- Left Column: Search + Top 4 -->
                <div class="left-column">
                    <!-- Search Container -->
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchIntentions" placeholder="Search initiatives..." onkeyup="handleSearch()">
                        </div>
                        <div id="searchResults" class="search-results empty">No results</div>
                    </div>
                    
                    <!-- Top 4 Container -->
                    <div class="top-4-container">
                        <div class="top-4-label">Top Initiatives for Your Pillar & Industry</div>
                        <div id="topIntentionsContainer" class="top-4-items"></div>
                    </div>
                </div>
                
                <!-- Right Column: Selections -->
                <div class="selections-container">
                    <div class="selections-label">Selected</div>
                    <div id="selectedContainer" class="selections empty">No selections</div>
                </div>
            </div>
            
            <button class="action-btn" onclick="submitPainPointsForm()" style="margin-top: 2rem;">Submit & View Recommendations</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script>
        let currentRecord = null;
        let selectedIntentionIds = new Set();
        let allIntentions = [];
        let topIntentions = [];
        let topIntentionIds = new Set();
        let fuzzySearcher = null;
        let searchTimeout;

        window.onload = async () => {
            const [pRes, iRes] = await Promise.all([fetch('/api/pillars'), fetch('/api/industries')]);
            const pData = await pRes.json();
            const iData = await iRes.json();
            pData.pillars.forEach(p => document.getElementById('pillarSelect').innerHTML += `<option value="${p.id}">${p.name}</option>`);
            iData.industries.forEach(i => document.getElementById('industrySelect').innerHTML += `<option value="${i.id}">${i.name}</option>`);
        };

        async function runAutoPopulate() {
            document.getElementById('popBtn').innerText = "Randomize Again";
            const res = await fetch('/api/generate-identity');
            currentRecord = await res.json();
            document.getElementById('firstName').value = currentRecord.firstName;
            document.getElementById('lastName').value = currentRecord.lastName;
            document.getElementById('email').value = currentRecord.email;
            document.getElementById('companyName').value = currentRecord.companyName;
        }

        async function submitLeadForm(event) {
            event.preventDefault();
            currentRecord = {
                ...currentRecord,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                companyName: document.getElementById('companyName').value,
                companySize: document.getElementById('companySize').value,
                industryId: document.getElementById('industrySelect').value,
                pillarId: document.getElementById('pillarSelect').value
            };
            
            // Fetch top 4 intentions + all intentions with scores
            const res = await fetch(`/api/intentions-with-scores?pillarId=${currentRecord.pillarId}&industryId=${currentRecord.industryId}`);
            const data = await res.json();
            
            topIntentions = data.topIntentions;
            allIntentions = data.allIntentions;
            topIntentionIds = new Set(topIntentions.map(t => t.id));
            
            // Initialize fuzzy searcher
            fuzzySearcher = new Fuse(allIntentions, {
                keys: ['label'],
                threshold: 0.3,
                includeScore: true
            });
            
            // Render top 4 intentions
            renderTopIntentions();
            
            // Clear search
            document.getElementById('searchIntentions').value = '';
            document.getElementById('searchResults').innerHTML = '<div class="empty">No results</div>';
            selectedIntentionIds.clear();
            updateSelectedDisplay();
            
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('mainContainer').classList.add('step2-active');
        }

        function renderTopIntentions() {
            const html = topIntentions.map(i => 
                `<div class="pill top-4" data-id="${i.id}" onclick="selectIntention(${i.id}, true)">
                    ${i.label}
                </div>`
            ).join('');
            document.getElementById('topIntentionsContainer').innerHTML = html;
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchIntentions').value.trim();
            
            if (!query) {
                document.getElementById('searchResults').innerHTML = '<div class="empty">No results</div>';
                return;
            }
            
            searchTimeout = setTimeout(() => performSearch(query), 300);
        }

        function performSearch(query) {
            if (!fuzzySearcher) return;
            
            // Use fuzzy matching to find results
            const results = fuzzySearcher.search(query).map(result => result.item);
            
            // Filter out items that are already selected or in top 4
            const filtered = results.filter(i => 
                !selectedIntentionIds.has(i.id) && 
                !topIntentionIds.has(i.id)
            );
            
            if (filtered.length === 0) {
                document.getElementById('searchResults').innerHTML = '<div class="empty">No results</div>';
                return;
            }
            
            const html = filtered.map(i => 
                `<div class="pill" data-id="${i.id}" onclick="selectIntention(${i.id}, false)">
                    ${i.label}
                </div>`
            ).join('');
            
            document.getElementById('searchResults').innerHTML = html;
        }

        function selectIntention(id, isTop4) {
            selectedIntentionIds.add(id);
            
            // Remove from search results or top 4
            if (isTop4) {
                const pill = document.querySelector(`#topIntentionsContainer .pill[data-id="${id}"]`);
                if (pill) pill.style.display = 'none';
            } else {
                const pill = document.querySelector(`#searchResults .pill[data-id="${id}"]`);
                if (pill) pill.style.display = 'none';
            }
            
            updateSelectedDisplay();
        }

        function removeSelection(id) {
            selectedIntentionIds.delete(id);
            
            // Show the item again in its original location
            const intention = allIntentions.find(i => i.id === id);
            if (intention) {
                if (topIntentionIds.has(id)) {
                    const pill = document.querySelector(`#topIntentionsContainer .pill[data-id="${id}"]`);
                    if (pill) pill.style.display = 'block';
                } else {
                    // Re-run search to show it again if search is active
                    const query = document.getElementById('searchIntentions').value.trim();
                    if (query) {
                        performSearch(query);
                    }
                }
            }
            
            updateSelectedDisplay();
        }

        function updateSelectedDisplay() {
            const selectedContainer = document.getElementById('selectedContainer');
            
            if (selectedIntentionIds.size === 0) {
                selectedContainer.innerHTML = '<div class="empty">No selections</div>';
                return;
            }
            
            const selectedIntentions = allIntentions.filter(i => selectedIntentionIds.has(i.id));
            const html = selectedIntentions.map(i => 
                `<div class="pill selected" data-id="${i.id}">
                    <span>${i.label}</span>
                    <span class="pill-remove" onclick="removeSelection(${i.id})">×</span>
                </div>`
            ).join('');
            
            selectedContainer.innerHTML = html;
        }

        async function submitPainPointsForm() {
            if (selectedIntentionIds.size === 0) {
                alert('Please select at least one initiative.');
                return;
            }

            document.getElementById('mainContainer').innerHTML = '<h1>Analyzing Matches...</h1>';
            
            // Step 1: Submit lead with selected intentions
            const res = await fetch('/api/submit-lead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...currentRecord, intentionIds: Array.from(selectedIntentionIds) })
            });
            const result = await res.json();

            // Step 2: Update engagement scores for selected intentions
            await fetch('/api/update-intention-scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intentionIds: Array.from(selectedIntentionIds) })
            });
            
            const container = document.getElementById('mainContainer');
            container.innerHTML = `<h1>Your Recommended Stack</h1><div id="pyramidContainer" style="display:flex; flex-direction:column; gap:15px; align-items:center; width:100%;"></div>`;
            
            if (!result.recommendations || result.recommendations.length === 0) {
                document.getElementById('pyramidContainer').innerHTML = `<p style="color:#86868b;">No matching tools found for your configurations.</p>`;
                return;
            }

            const cardScales = [1.6, 1.15, 1.0];

            result.recommendations.forEach((prod, i) => {
                const scale = cardScales[i] ?? 1.0;
                const padding = Math.round(20 * scale);
                const logoH = Math.round(45 * scale);
                const logoW = Math.round(140 * scale);
                const h3Size = (1.15 * scale).toFixed(2);
                const bySize = (0.8 * scale).toFixed(2);
                const scoreSize = (0.75 * scale).toFixed(2);
                const gap = Math.round(8 * scale);

                const card = document.createElement('div');
                card.style.cssText = `width:${100-(i*12)}%; background:#white; border: 1px solid #d2d2d7; padding:${padding}px; border-radius:12px; text-align:center; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: ${gap}px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);`;

                let logoImg = '';
                if (prod.logo_url) {
                    logoImg = `<img src="${prod.logo_url}" alt="${prod.product_name}" style="max-height: ${logoH}px; max-width: ${logoW}px; object-fit: contain; margin-bottom: 4px;" onerror="this.style.display='none'">`;
                }

                card.innerHTML = `
                    ${logoImg}
                    <h3 style="margin: 0; color: #1d1d1f; font-size: ${h3Size}rem;">${prod.product_name}</h3>
                    <span style="font-size: ${bySize}rem; color: #86868b; font-weight: 500;">by ${prod.company_name}</span>
                    <span style="display: inline-block; background: #e8e8ed; color: #1d1d1f; font-size: ${scoreSize}rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; margin-top: 4px;">Score: ${prod.total_score}</span>
                `;
                document.getElementById('pyramidContainer').appendChild(card);
            });

            // Email-these-suggestions form (prefilled with the email from Step 1)
            const emailSection = document.createElement('div');
            emailSection.style.cssText = `margin-top:30px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; align-items:center;`;
            emailSection.innerHTML = `
                <p style="margin:0; color:#1d1d1f; font-weight:600;">Email these suggestions to yourself</p>
                <div style="display:flex; gap:8px; width:100%;">
                    <input type="email" id="recipientEmail" value="${currentRecord.email || ''}" placeholder="you@company.com" style="flex:1; padding:10px 12px; border:1px solid #d2d2d7; border-radius:8px; font-size:0.95rem; box-sizing:border-box;">
                    <button type="button" id="sendEmailBtn" style="padding:10px 18px; background:#0071e3; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Send</button>
                </div>
                <span id="emailStatus" style="font-size:0.85rem; color:#86868b; min-height:1rem;"></span>
            `;
            container.appendChild(emailSection);

            document.getElementById('sendEmailBtn').addEventListener('click', async () => {
                const btn = document.getElementById('sendEmailBtn');
                const statusEl = document.getElementById('emailStatus');
                const email = document.getElementById('recipientEmail').value.trim();
                if (!email) {
                    statusEl.style.color = '#d70015';
                    statusEl.textContent = 'Please enter an email address.';
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Sending...';
                statusEl.style.color = '#86868b';
                statusEl.textContent = '';
                try {
                    const resp = await fetch('/api/email-recommendations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email,
                            firstName: currentRecord.firstName,
                            companyName: currentRecord.companyName,
                            recommendations: result.recommendations
                        })
                    });
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || 'Failed to send.');
                    statusEl.style.color = '#1d8a3f';
                    statusEl.textContent = 'Sent! Check your inbox.';
                    btn.textContent = 'Sent';
                } catch (err) {
                    statusEl.style.color = '#d70015';
                    statusEl.textContent = err.message;
                    btn.disabled = false;
                    btn.textContent = 'Send';
                }
            });
        }
    </script>
</body>
</html>
